# Apache vhost for the CI3 rehearsal container.
#
# DocumentRoot must be the repo root: application code requires files through
# $_SERVER['DOCUMENT_ROOT'].'/lib/...' (Upload_excel.php:56, Login.php:204, Contact.php:188).

<VirtualHost *:80>
    DocumentRoot /var/www/html

    # ENVIRONMENT is read from $_SERVER['CI_ENV'] (index.php:56), not getenv(), so a plain
    # container env var is not enough - it has to be set by the server. development keeps
    # errors visible, which is the point of a rehearsal run.
    SetEnv CI_ENV development

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        # Debian ships AllowOverride None, which would silently ignore the whole .htaccess
        # including the mod_rewrite front controller.
        AllowOverride All
        Require all granted
    </Directory>

    # WP-00F: deny direct execution/read of application internals. The repo .htaccess already
    # rewrites ^system and ^application into the front controller, this is the belt to that
    # suspenders and also covers paths .htaccess does not mention.
    <DirectoryMatch "^/var/www/html/(application|system)/">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "\.(md|sql|log|ini|sh)$">
        Require all denied
    </FilesMatch>

    <Files ".env">
        Require all denied
    </Files>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
