name: samsonitetracking-ci4-migration

services:
  db:
    image: "${MARIADB_IMAGE:?MARIADB_IMAGE is required}"
    # Server config via command flags, not my.cnf: the image ships a Debian layout with two
    # !includedir levels, so a mounted conf file can be silently overridden. Flags beat every
    # config file and show up in `docker compose config` so they can be hashed as evidence.
    command:
      - mariadbd
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      # 11.4.12 ships character_set_collations=utf8mb4=utf8mb4_uca1400_ai_ci, so any bare
      # `utf8mb4` literal or DDL would get uca1400 and collide with our general_ci tables
      # (ERROR 1267). Pin the charset default too, not just the server default.
      - --character-set-collations=utf8mb4=utf8mb4_general_ci
      # Must NOT contain NO_ZERO_DATE / NO_ZERO_IN_DATE: the legacy data holds 44,941 real
      # zero-date values plus DEFAULT '0000-00-00 00:00:00' column defaults.
      - --sql-mode=NO_AUTO_VALUE_ON_ZERO,NO_ENGINE_SUBSTITUTION
      # DYNAMIC keeps the index prefix limit at 3072 bytes; uploadstaus.tracking_id is
      # 1000 bytes as utf8mb4 and would fail under COMPACT's 767-byte limit.
      - --innodb-default-row-format=dynamic
      - --innodb-buffer-pool-size=1073741824
      - --innodb-log-file-size=536870912
      # Rehearsal box only. Never carry this to production.
      - --innodb-flush-log-at-trx-commit=2
      - --max-allowed-packet=67108864
      - --skip-name-resolve
      # Timestamp contract (2026-08-23 decision): Asia/Bangkok everywhere. Numeric offset,
      # not a named zone, because tz tables are not loaded. Every TIMESTAMP column with
      # DEFAULT/ON UPDATE current_timestamp() (cdate on 13 legacy tables) stamps in this
      # zone, matching PHP appTimezone. Set BEFORE any production dump import: TIMESTAMP
      # strings are interpreted in this zone at load time, so import and read must both
      # run under +07:00 for dump parity (V13 in db/dbctl.sh).
      - --default-time-zone=+07:00
    environment:
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD is required}"
      MARIADB_DATABASE: "${MARIADB_DATABASE:?MARIADB_DATABASE is required}"
      MARIADB_USER: "${MARIADB_USER:?MARIADB_USER is required}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD:?MARIADB_PASSWORD is required}"
    ports:
      # DEV-DB-PORT-001: publishing the DB port deviates from DKR-05/DKR-07.
      # Compensating control: loopback-only bind, never all-interface.
      - name: mariadb
        target: 3306
        host_ip: 127.0.0.1
        published: "${DB_HOST_PORT:?DB_HOST_PORT is required}"
        protocol: tcp
    networks:
      - backend
    volumes:
      - mariadb_data:/var/lib/mysql
      # Gate 1D requires backups to live on an owned volume, never a bind mount or a
      # host path. Project-scoped and unnamed, same as the data volume.
      - backup_data:/backup
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 10
    # Never auto-start with Docker Desktop: keeps this project's host footprint deliberate.
    restart: "no"
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # CI3 rehearsal runtime. Built separately by `dbctl.sh web-build` so the build can point
  # its context at the pinned CI3 repo and its exclude list at web/Dockerfile.dockerignore.
  web:
    image: "${CI3_WEB_IMAGE:?CI3_WEB_IMAGE is required}"
    environment:
      CI3_DB_HOST: db
      CI3_DB_PORT: "3306"
      CI3_DB_NAME: "${MARIADB_DATABASE:?}"
      CI3_DB_USER: "${MARIADB_USER:?}"
      CI3_DB_PASSWORD: "${MARIADB_PASSWORD:?}"
    ports:
      - name: http
        target: 80
        host_ip: 127.0.0.1
        published: "${WEB_HOST_PORT:?WEB_HOST_PORT is required}"
        protocol: tcp
    networks:
      - backend
    depends_on:
      db:
        # CI3 autoloads the database library, so it connects during bootstrap on every
        # request. Starting before the database is ready means every page 500s.
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # CI4 migration runtime. Independent from CI3 `web`; waits for its isolated DB service.
  ci4:
    image: samsonitetracking-ci4:4.7.4-php8.5.7
    build:
      context: .
      dockerfile: Dockerfile.ci4
    environment:
      CI_ENVIRONMENT: development
      app_baseURL: "http://127.0.0.1:${CI4_HOST_PORT:-18405}/"
      database_default_hostname: db
      database_default_port: "3306"
      database_default_database: "${CI4_DATABASE:-samsonite_ci4}"
      database_default_username: "${MARIADB_USER:?MARIADB_USER is required}"
      database_default_password: "${MARIADB_PASSWORD:?MARIADB_PASSWORD is required}"
      database_default_DBDriver: MySQLi
      encryption_driver: Sodium
      encryption_key: "${CI4_RESET_ENCRYPTION_KEY:-}"
    ports:
      - name: ci4-http
        target: 8080
        host_ip: 127.0.0.1
        published: "${CI4_HOST_PORT:-18405}"
        protocol: tcp
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - 'exit(json_decode(file_get_contents("http://127.0.0.1:8080/health"), true)["status"] === "ok" ? 0 : 1);'
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # DEV-DB-PORT-001: `internal: true` is incompatible with a published port, so it is
  # deliberately absent. Still project-scoped, not external, no explicit name, no fixed
  # subnet. Restore `internal: true` and drop the ports block once an app service exists.
  backend: {}

volumes:
  mariadb_data: {}
  backup_data: {}
